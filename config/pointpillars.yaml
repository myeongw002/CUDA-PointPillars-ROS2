pointpillars_node:
  ros__parameters:
    # Default COMPA pipeline input. Override at launch/runtime only when needed.
    input_cloud_topic: /pc_interpoled
    output_detections_topic: /pointpillars/detections

    # Leave empty to use the model installed with this package.
    model_path: ""

    intensity_field: intensity
    intensity_scale: 1.0
    allow_missing_intensity: false

    score_threshold: 0.1
    nms_iou_threshold: 0.01
    class_aware_nms: true

    initial_point_capacity: 250000
    class_names: [Car, Pedestrian, Cyclist]

pointpillars_visualizer:
  ros__parameters:
    input_detections_topic: /pointpillars/detections
    output_markers_topic: /pointpillars/markers
    box_alpha: 0.25
    text_scale: 0.6
    marker_lifetime_sec: 0.5
    show_labels: true
